name: CI

# Lint y pruebas en cada PR y en cada push a main
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (lint + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Pruebas
        run: npm test

      - name: Compilar la tienda
        run: npm run build:tienda

  backend:
    name: Backend (PHPUnit + MariaDB)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:12.2.2
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sgtdb_test
          MARIADB_USER: sgt_test
          MARIADB_PASSWORD: sgt_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_sqlite, curl
          coverage: none

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --no-progress --working-dir=backend

      - name: Pruebas
        working-directory: backend
        run: vendor/bin/phpunit
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sgtdb_test
          DB_USER: sgt_test
          DB_PASS: sgt_test

  sgt:
    name: SGT (Electron)
    runs-on: ubuntu-latest

    # La app de escritorio compilada, manejada con Playwright: arranca el PHP del sistema en el 8000 y usa esta MariaDB
    services:
      mariadb:
        image: mariadb:12.2.2
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sgtdb_test
          MARIADB_USER: sgt_test
          MARIADB_PASSWORD: sgt_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --no-progress --working-dir=backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Con el binario de Electron (el job de la tienda lo omite)
      - name: Instalar dependencias de Node
        run: npm ci

      # pdftotext y pdfinfo leen los tickets y reportes en PDF que genera la app
      - name: Instalar poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Pruebas de la app de escritorio
        run: xvfb-run -a npm run test:e2e:sgt
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: sgtdb_test
          DB_USER: sgt_test
          DB_PASS: sgt_test

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-sgt
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  tienda:
    name: Tienda (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Igual que en el equipo del profesor: solo Docker
      - name: Levantar con docker compose
        run: |
          cp .env.example .env
          docker compose up --build -d

      - name: Esperar al API de la tienda
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/tienda/config && exit 0
            sleep 3
          done
          exit 1

      - name: Revisar la tienda
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/producto/1 | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/tienda/config | grep -q '"tasa_iva":16'
          curl -fsS http://localhost:8080/api/tienda/categorias | grep -q '"nombre":"Abarrotes","productos":15'
          curl -fsS 'http://localhost:8080/api/tienda/productos?q=azucar' | grep -q 'Azúcar estándar 1 kg'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/tienda/producto?id=99999)" = 404
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"productos":[{"id":5,"cantidad":2}]}' \
            http://localhost:8080/api/tienda/carrito/revisar | grep -q '"subtotal":58.62,"iva":9.38,"tasa_iva":16,"envio":0,"total":68'
          curl -fsS -c cookies.txt -X POST -H 'Content-Type: application/json' \
            -d '{"nombre":"Ana","apellidos":"Pérez","correo":"ana@ejemplo.mx","telefono":"6561234567","password":"secreta123"}' \
            http://localhost:8080/api/tienda/registro | grep -q '"correo":"ana@ejemplo.mx"'
          curl -fsS -b cookies.txt http://localhost:8080/api/tienda/cuenta | grep -q '"nombre":"Ana"'
          curl -fsS -b cookies.txt -X POST -H 'Content-Type: application/json' \
            -d '{"recibe":"Ana Pérez","telefono":"6561234567","calle":"Av. Juárez","numero_exterior":"123","colonia":"Centro","codigo_postal":"32000","ciudad":"Ciudad Juárez","entidad":"Chihuahua"}' \
            http://localhost:8080/api/tienda/entrega | grep -q '"codigo_postal":"32000"'
          curl -fsS -b cookies.txt -X POST -H 'Content-Type: application/json' \
            -d '{"productos":[{"id":5,"cantidad":2}],"clave":"clave-de-ci-0001"}' \
            http://localhost:8080/api/tienda/pedidos | tee pedido.json | grep -q '"creado":true'
          FOLIO=$(sed -E 's/.*"folio":"([^"]+)".*/\1/' pedido.json)
          curl -fsS -b cookies.txt -X POST -H 'Content-Type: application/json' -d "{\"folio\":\"$FOLIO\",\"metodo\":\"tarjeta\"}" \
            http://localhost:8080/api/tienda/pedido/pagar | grep -q '"pagado":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/getAllProducts)" = 404
          docker compose logs backend | grep -q 'Catálogo de la tienda cargado: 12 categorías y 180 productos'

      # Pruebas en el navegador (N1–N11, P1–P15) contra la misma tienda de Docker
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias de Node
        run: npm ci
        env:
          # Las pruebas de la tienda no necesitan el binario de Electron
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas en el navegador
        run: npm run test:e2e:tienda

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs
