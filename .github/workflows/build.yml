name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  # También en los PRs que cambian el empaquetado o el arranque de la app (proceso principal, dependencias)
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'src/main/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.mjs'
      - 'backend/composer.json'
      - 'backend/composer.lock'

# Un push nuevo al mismo PR cancela la compilación anterior
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  MARIADB_VERSION: '12.2.2'
  # PHP y MariaDB vienen del release público "binaries" del repositorio original (solo se descargan).
  # Para usar los de este repositorio, crear su propio release "binaries" y cambiar esta variable.
  BINARIES_REPO: EduardGarrido/SGT

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            dist_cmd: dist:linux
          - os: windows-latest
            platform: win
            dist_cmd: dist:win
          # macOS skipped: MariaDB no longer ships pre-built macOS binary tarballs
          # - os: macos-latest
          #   platform: mac
          #   dist_cmd: dist:mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # ── PHP ──────────────────────────────────────────────────────────────────

      - name: Download PHP (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p resources/php/linux
          gh release download binaries --repo ${{ env.BINARIES_REPO }} --pattern "php-linux.tar.gz" --output php-linux.tar.gz
          tar xz -C resources/php/linux < php-linux.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PHP (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force resources/php/win | Out-Null
          gh release download binaries --repo ${{ env.BINARIES_REPO }} --pattern "php-win.zip" --output php-win.zip
          Expand-Archive php-win.zip resources/php/win -Force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PHP (macOS)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p resources/php/mac
          gh release download binaries --repo ${{ env.BINARIES_REPO }} --pattern "php-mac.tar.gz" --output php-mac.tar.gz
          tar xz -C resources/php/mac < php-mac.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── MariaDB ───────────────────────────────────────────────────────────────

      - name: Download MariaDB (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p resources/mysql/linux
          gh release download binaries --repo ${{ env.BINARIES_REPO }} --pattern "mysql-linux.tar.gz" --output mysql-linux.tar.gz
          tar xz -C resources/mysql/linux < mysql-linux.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download MariaDB (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force resources/mysql/win | Out-Null
          gh release download binaries --repo ${{ env.BINARIES_REPO }} --pattern "mysql-win.zip" --output mysql-win.zip
          Expand-Archive mysql-win.zip resources/mysql/win -Force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download MariaDB (macOS)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p resources/mysql/mac
          curl -L "https://mirror.mariadb.org/mariadb-${{ env.MARIADB_VERSION }}/bintar-osx14-arm64/mariadb-${{ env.MARIADB_VERSION }}-osx14-arm64.tar.gz" \
            | tar xz --strip-components=1 -C resources/mysql/mac

      # ── Build ─────────────────────────────────────────────────────────────────

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --working-dir=backend

      - name: Build
        run: npm run ${{ matrix.dist_cmd }}

      # Primer arranque de la app empaquetada (Linux): MariaDB inicializa sus datos, PHP responde y se cierra.
      # El runner trae un MySQL instalado con su /etc/mysql/my.cnf: comprueba que la app no lo lee (--no-defaults)
      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        run: |
          xvfb-run -a release/linux-unpacked/sgt --no-sandbox > arranque.log 2>&1 &
          listo=no
          for i in $(seq 1 90); do
            if [ -f ~/.config/sgt/php.json ]; then
              puerto=$(node -p "require(process.env.HOME + '/.config/sgt/php.json').puerto")
              if curl -sf "http://localhost:$puerto/api/ping"; then listo=si; break; fi
            fi
            sleep 2
          done
          # SIGTERM al proceso principal (el más antiguo llamado sgt): Electron se cierra de forma normal
          kill -TERM "$(pgrep -o -x sgt)" || true
          sleep 8
          grep -v "dbus\|Fontconfig" arranque.log | tail -40
          test "$listo" = si
          grep -q "Usuario admin creado" arranque.log
          # Al cerrarse la app se apagan MariaDB y PHP
          ! pgrep -f mysql_data
          ! curl -sf "http://localhost:$puerto/api/ping"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sgt-${{ matrix.platform }}
          # Solo los instaladores y comprimidos (sin la carpeta linux-unpacked / win-unpacked)
          path: |
            release/*.tar.gz
            release/*.exe
            release/*.zip
          retention-days: 14

  # Con una etiqueta v* publica un release de GitHub con los instaladores.
  # Los artefactos del workflow se borran a los 14 días; los archivos de un release se conservan.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      - name: Publish release
        run: |
          ls -la instaladores
          gh release create "$GITHUB_REF_NAME" instaladores/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SGT $GITHUB_REF_NAME" \
            --notes "Instaladores de SGT $GITHUB_REF_NAME: Windows (.exe instalador y .zip) y Linux (.tar.gz). No necesitan PHP, MariaDB ni internet. Cómo abrirlos: README, sección «Probar la app instalada»."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
