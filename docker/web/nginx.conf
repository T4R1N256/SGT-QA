server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API de la tienda: se reenvía al backend PHP conservando el host:puerto original,
    # así el backend reconoce las peticiones como del mismo origen
    location /api/tienda/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # El resto del API (SGT de escritorio) no se publica en el sitio de la tienda
    location /api/ {
        default_type application/json;
        return 404 '{"ok":false,"mensaje":"Ruta no encontrada"}';
    }

    # Los archivos compilados llevan un hash en el nombre: se pueden guardar en caché
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de la app (/producto/12, /carrito...): si no es un archivo, se sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
